<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a0a12" />
  <title>Mecka Rumble</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Share+Tech+Mono&display=swap" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./src/ui/hangar.css" />

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- ===== MAIN MENU ===== -->
  <section id="menu-screen" class="screen show">
    <div class="menu-stack">
      <div class="menu-title">MECKA<br>RUMBLE</div>
      <div class="menu-sub">— PROTOTYPE —</div>
      <button class="modal-btn primary" data-menu="battle">BATTLE</button>
      <button class="modal-btn" data-menu="hangar">MECKA HANGAR</button>
    </div>
  </section>

  <!-- ===== MECKA HANGAR ===== -->
  <section id="hangar-screen" class="screen">

    <div class="hangar-stage">
      <canvas id="hangar-canvas"></canvas>
      <svg id="hangar-lines"></svg>
      <div id="hangar-nodes"></div>
      <div id="hangar-flash"></div>
    </div>

    <div class="hangar-pad">
      <div class="pad-cols">
        <div class="pad-left">
          <div id="hangar-stats" class="panel"></div>
          <div id="hangar-eyes" class="panel"></div>
        </div>
        <div class="pad-right">
          <div id="hangar-tabs">
            <button data-mode="components" class="on">COMPONENTS</button>
            <button data-mode="sets">FULL SETS</button>
          </div>
          <div id="hangar-grid"></div>
        </div>
      </div>
      <div id="hangar-blurb"></div>
      <div class="hangar-actions">
        <button id="hangar-back">BACK</button>
        <button id="hangar-confirm" disabled>CONFIRM LOADOUT</button>
        <button id="hangar-fullset">EQUIP FULL SET</button>
      </div>
    </div>

  </section>

  <!-- ===== BATTLE SCREEN (auto-brawl + Console) ===== -->
  <section id="battle-screen" class="screen">
    <div id="app">
      <section id="combat" aria-label="Battle viewport">
        <canvas id="gl"></canvas>
        <div class="hud">
          <div id="announcer" class="announcer"></div>
          <div id="debug" class="debug"></div>
        </div>
        <button id="pause-btn" class="pause-btn" aria-label="Pause">II</button>
      </section>

      <section id="console" aria-label="Console">
        <div class="console-head">
          <div id="console-wave" class="console-wave">WAVE 1/1</div>
          <div class="console-mode">AUTO</div>
          <button id="console-speed" class="console-speed">x1</button>
        </div>
        <div id="console-cards"></div>
      </section>
    </div>
  </section>

  <!-- ===== Pause modal ===== -->
  <div id="pause-modal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-title">PAUSED</div>
      <div class="modal-sub">— BREATHE —</div>
      <button class="modal-btn primary" data-action="resume">RESUME</button>
      <button class="modal-btn" data-action="restart">RESTART MATCH</button>
      <button class="modal-btn" data-action="menu">MAIN MENU</button>

      </div>
    </div>
  </div>

  <!-- ===== End-of-fight modal ===== -->
  <div id="end-modal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-title" id="end-title">K.O.</div>
      <div class="modal-sub"  id="end-sub">FIGHT OVER</div>
      <button class="modal-btn primary" data-action="rematch">AGAIN</button>
      <button class="modal-btn" data-action="end-menu">MAIN MENU</button>
    </div>
  </div>

  <div id="rotate-overlay" class="rotate-overlay">
    <div class="rotate-inner">
      <div class="rotate-icon">⟳</div>
      <div>Please rotate your device to portrait</div>
    </div>
  </div>

  <div id="build-version"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
